# Keys are comma-separated TemplateField names
# Values are lists of StringSubstitutor templates

FIRST_NAME:
  - "${FIRST_NAME}123"
  - "${FIRST_NAME}999"
  - "${FIRST_NAME}${NUM10}"
  - "${FIRST_NAME}${NUM100}"
  - "${FIRST_NAME}${NUM1000}"

FIRST_NAME,LAST_NAME:
  - "${FIRST_NAME}${SEPARATOR}${LAST_NAME}"
  # johndoe
  - "${FIRST_NAME}${LAST_NAME}"
  # john.d
  - "${FIRST_NAME}${LAST_INITIAL}"
  # john.d##
  - "${FIRST_NAME}${LAST_INITIAL}${NUM10}"
  # john.d###
  - "${FIRST_NAME}${LAST_INITIAL}${NUM100}"
  - "${FIRST_NAME}${LAST_INITIAL}${NUM1000}"

FIRST_NAME,LAST_NAME,MIDDLE_NAME:
  # johnjosephdoe
  - "${FIRST_NAME}${MIDDLE_INITIAL}${LAST_NAME}"
  # johnjdoe
  - "${FIRST_NAME}${MIDDLE_INITIAL}${LAST_NAME}"
  # j.j.doe
  - "${FIRST_INITIAL}${SEPARATOR}${MIDDLE_INITIAL}${SEPARATOR}${LAST_NAME}"
  # john.j.d
  - "${FIRST_NAME}${SEPARATOR}${MIDDLE_INITIAL}${SEPARATOR}${LAST_INITIAL}"

FIRST_NAME,LAST_NAME,BIRTHDAY:
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_YEAR}"
  # johndoe2000
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_YEAR}"
  # johndoe00
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_YEAR_SHORT}"
  # johndoe00
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_DAY}"
  # johnd2000
  - "${FIRST_NAME}${LAST_INITIAL}${BIRTHDAY_YEAR}"
  # johnd2000
  - "${FIRST_NAME}${LAST_INITIAL}${BIRTHDAY_YEAR_SHORT}"
  # johndoe2000
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_YEAR}"
  # johndoe00
  - "${FIRST_NAME}${LAST_NAME}${BIRTHDAY_YEAR_SHORT}"
  # johnd2000
  - "${FIRST_NAME}${LAST_INITIAL}${BIRTHDAY_YEAR}"
  # johnd2000
  - "${FIRST_NAME}${LAST_INITIAL}${BIRTHDAY_YEAR_SHORT}"

KEYWORD1:
  - "${KEYWORD1}${SEPARATOR}${NUM1000}"
  - "${KEYWORD1}${NUM10}"
  - "${KEYWORD1}${NUM100}"
  - "${KEYWORD1}${NUM1000}"

KEYWORD1,FIRST_NAME:
  - "${FIRST_NAME}_hoops"
  - "${FIRST_NAME}_skates"
  - "${FIRST_NAME}${SEPARATOR}gamer"
  - "${FIRST_NAME}${SEPARATOR}codes"
  - "${FIRST_NAME}${SEPARATOR}draws"
  - "surfer${SEPARATOR}${FIRST_NAME}"
  # surfergirl_
  - "x_${FIRST_NAME}_x"

KEYWORD1,KEYWORD2:
  - "${KEYWORD1}${SEPARATOR}${KEYWORD2}"
  - "${KEYWORD1}${KEYWORD2}${NUM10}"
  - "${KEYWORD1}${KEYWORD2}${NUM100}"
  - "${KEYWORD1}${KEYWORD2}${NUM1000}"

KEYWORD1,KEYWORD2,KEYWORD3:
  - "${KEYWORD1}${SEPARATOR}${KEYWORD2}${SEPARATOR}${KEYWORD3}"
